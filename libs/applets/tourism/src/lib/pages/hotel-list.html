<div class="flex flex-col gap-4 px-4 py-6">

  <!-- نوار جست‌وجو -->
  <section hlmCard>
    <div hlmCardContent class="flex flex-col gap-3 pt-6">

      <div class="flex items-center gap-2">
        <div class="bg-secondary text-primary flex size-10 shrink-0 items-center justify-center rounded-xl">
          <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 20h20" />
            <path d="M4 20V8l8-5 8 5v12" />
            <path d="M9 20v-6h6v6" />
          </svg>
        </div>
        <div class="leading-tight">
          <h1 class="font-bold">رزرو هتل</h1>
          <p class="text-muted-foreground text-xs">با اعتبار گردشگری شما</p>
        </div>
      </div>

      <label class="flex flex-col gap-1.5">
        <span class="text-xs font-medium">شهر</span>
        <select
          class="border-input bg-background focus-visible:ring-ring h-10 rounded-lg border px-3 text-sm focus-visible:ring-2 focus-visible:outline-none"
          [value]="cityId()"
          (change)="onCityChange($any($event.target).value)"
        >
          <option [value]="0">همهٔ شهرها</option>
          @for (city of cities(); track city.id) {
            <option [value]="city.id">{{ city.name }}</option>
          }
        </select>
      </label>

      <div class="flex gap-3">
        <label class="flex flex-1 flex-col gap-1.5">
          <span class="text-xs font-medium">تاریخ ورود</span>
          <input
            type="date"
            dir="ltr"
            class="border-input bg-background focus-visible:ring-ring h-10 rounded-lg border px-3 text-sm focus-visible:ring-2 focus-visible:outline-none"
            [min]="minDate"
            [value]="checkin()"
            (change)="checkin.set($any($event.target).value)"
          />
        </label>
        <label class="flex w-28 flex-col gap-1.5">
          <span class="text-xs font-medium">تعداد شب</span>
          <input
            type="number"
            dir="ltr"
            min="1"
            max="30"
            class="border-input bg-background focus-visible:ring-ring h-10 rounded-lg border px-3 text-center text-sm focus-visible:ring-2 focus-visible:outline-none"
            [value]="nights()"
            (change)="onNightsChange($any($event.target).value)"
          />
        </label>
      </div>

      <p class="text-muted-foreground text-xs">{{ stayLabel() }}</p>

    </div>
  </section>

  @if (loading()) {
    <hlm-skeleton class="h-44 w-full rounded-2xl" />
    <hlm-skeleton class="h-44 w-full rounded-2xl" />
    <hlm-skeleton class="h-44 w-full rounded-2xl" />
  } @else if (error()) {
    <section hlmCard>
      <div hlmCardContent class="flex flex-col items-center gap-4 py-10 text-center">
        <p class="text-muted-foreground text-sm">{{ error() }}</p>
        <button class="text-primary text-sm font-medium hover:underline" (click)="load()">
          تلاش دوباره
        </button>
      </div>
    </section>
  } @else {

    @for (hotel of hotels(); track hotel.id) {
      <button
        type="button"
        class="w-full text-right transition-transform active:scale-[0.99]"
        (click)="openHotel(hotel)"
      >
        <section hlmCard class="overflow-hidden">

          <!-- تصویر هتل از سرور هتل‌یار می‌آید؛ اگر لود نشد به جای کادر خالی
               همان placeholder را نشان می‌دهیم -->
          @if (hotel.photo && !brokenImages().has(hotel.id)) {
            <img
              [src]="hotel.photo"
              [alt]="hotel.name"
              loading="lazy"
              class="h-40 w-full object-cover"
              (error)="markBroken(hotel.id)"
            />
          } @else {
            <div class="bg-secondary flex h-40 w-full items-center justify-center">
              <svg class="text-muted-foreground size-10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                <path d="M2 20h20M4 20V8l8-5 8 5v12" />
              </svg>
            </div>
          }

          <div hlmCardContent class="flex flex-col gap-2 pt-4">
            <div class="flex items-start justify-between gap-2">
              <h2 class="flex-1 font-bold leading-tight">{{ hotel.name }}</h2>
              <span class="flex shrink-0 items-center gap-0.5 text-amber-500">
                @for (star of stars(hotel.rate); track star) {
                  <svg class="size-3.5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z" />
                  </svg>
                }
                <span class="sr-only">{{ count(hotel.rate) }} ستاره</span>
              </span>
            </div>

            <div class="flex flex-wrap items-center gap-2">
              <span hlmBadge variant="secondary" class="rounded-full font-normal">{{ hotel.type }}</span>
              @if (hotel.cityName) {
                <span hlmBadge variant="secondary" class="rounded-full font-normal">{{ hotel.cityName }}</span>
              }
            </div>

            <p class="text-muted-foreground text-xs leading-relaxed">{{ hotel.address }}</p>
          </div>

        </section>
      </button>
    } @empty {
      <section hlmCard>
        <div hlmCardContent class="py-10 text-center">
          <p class="text-muted-foreground text-sm">
            هتلی در این شهر پیدا نشد.
          </p>
        </div>
      </section>
    }

  }

</div>

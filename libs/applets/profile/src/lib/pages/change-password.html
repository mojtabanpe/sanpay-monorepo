<div class="flex flex-col gap-4 px-4 py-6">

  <div class="flex items-center gap-2.5">
    <div class="bg-secondary text-primary flex size-10 shrink-0 items-center justify-center rounded-xl">
      <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect width="18" height="11" x="3" y="11" rx="2" />
        <path d="M7 11V7a5 5 0 0 1 10 0v4" />
      </svg>
    </div>
    <div class="leading-tight">
      <h1 class="font-bold">تغییر رمز عبور</h1>
      <p class="text-muted-foreground text-xs">حداقل ۸ کاراکتر</p>
    </div>
  </div>

  <section hlmCard>
    <div hlmCardContent class="flex flex-col gap-3 pt-6">

      @if (done()) {
        <div class="flex flex-col items-center gap-2 py-6 text-center">
          <svg class="text-primary size-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10" />
            <path d="m9 12 2 2 4-4" />
          </svg>
          <p class="text-sm font-medium">رمز عبور با موفقیت تغییر کرد</p>
        </div>
      } @else {
        <label class="flex flex-col gap-1.5">
          <span class="text-xs font-medium">رمز عبور فعلی</span>
          <input
            type="password"
            autocomplete="current-password"
            class="border-input bg-background focus-visible:ring-ring h-10 rounded-lg border px-3 text-sm focus-visible:ring-2 focus-visible:outline-none"
            [value]="current()"
            (input)="current.set($any($event.target).value); error.set(null)"
          />
        </label>

        <label class="flex flex-col gap-1.5">
          <span class="text-xs font-medium">رمز عبور جدید</span>
          <input
            type="password"
            autocomplete="new-password"
            class="border-input bg-background focus-visible:ring-ring h-10 rounded-lg border px-3 text-sm focus-visible:ring-2 focus-visible:outline-none"
            [value]="next()"
            (input)="next.set($any($event.target).value); error.set(null)"
          />
        </label>

        <label class="flex flex-col gap-1.5">
          <span class="text-xs font-medium">تکرار رمز عبور جدید</span>
          <input
            type="password"
            autocomplete="new-password"
            class="border-input bg-background focus-visible:ring-ring h-10 rounded-lg border px-3 text-sm focus-visible:ring-2 focus-visible:outline-none"
            [value]="confirm()"
            (input)="confirm.set($any($event.target).value); error.set(null)"
          />
        </label>

        @if (error()) {
          <p class="text-destructive text-xs">{{ error() }}</p>
        }

        <button type="button" hlmBtn class="w-full" [disabled]="busy()" (click)="submit()">
          ثبت رمز جدید
        </button>
      }
    </div>
  </section>
</div>

proxy_cache_path /var/cache/nginx/map_tiles levels=1:2 keys_zone=map_tiles:10m
    max_size=256m inactive=7d use_temp_path=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve only visible OSM tiles through the site's origin. Preserve upstream
    # caching headers and identify the application as required by OSM's policy.
    location ~ ^/map-tiles/([0-9]{1,2})/([0-9]+)/([0-9]+)\.png$ {
        resolver 127.0.0.11 valid=300s;
        set $tile_url https://tile.openstreetmap.org/$1/$2/$3.png;
        proxy_pass $tile_url;
        proxy_ssl_server_name on;
        proxy_ssl_name tile.openstreetmap.org;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host tile.openstreetmap.org;
        proxy_set_header User-Agent "Sanpay/1.0 (+https://sanpayco.com)";
        proxy_set_header Referer https://admin.sanpayco.com/;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_cache map_tiles;
        proxy_cache_key $tile_url;
        proxy_cache_valid 200 7d;
        proxy_cache_lock on;
        proxy_connect_timeout 10s;
        proxy_read_timeout 15s;
    }

    location /map-tiles/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://api:6500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Docker can assign different IPs when frontend containers are recreated.
# Resolve service names at request time rather than keeping startup addresses.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

server {
    listen 80 default_server;
    server_name sanpayco.com www.sanpayco.com;

    location / {
        set $employee_backend app:80;
        proxy_pass http://$employee_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}


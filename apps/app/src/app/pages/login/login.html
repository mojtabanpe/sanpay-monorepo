<main class="mx-auto flex min-h-dvh w-full max-w-[550px] flex-col items-center justify-center gap-8 px-4 py-10">

  <!-- برند -->
  <div class="flex flex-col items-center gap-3 text-center">
    <div
      class="flex size-14 items-center justify-center rounded-2xl bg-primary text-lg font-bold text-primary-foreground"
    >
      ج‌ف
    </div>
    <div class="leading-tight">
      <p class="text-lg font-bold">جهان‌فولاد سیرجان</p>
      <p class="text-muted-foreground text-sm">سامانه رفاهی پرسنل</p>
    </div>
  </div>

  <!-- کارت ورود -->
  <section hlmCard class="w-full max-w-md">
    <div hlmCardHeader>
      <h1 hlmCardTitle class="text-xl">ورود کارکنان</h1>
      <p hlmCardDescription>
        با کد ملی و رمز عبور خود وارد سامانه شوید.
      </p>
    </div>
    <div hlmCardContent class="flex flex-col gap-5">
      <div class="flex flex-col gap-2">
        <label hlmLabel for="national-code">کد ملی</label>
        <input
          hlmInput
          id="national-code"
          inputmode="numeric"
          maxlength="10"
          placeholder="مثلاً ۳۰۶۰۱۲۳۴۵۶"
          #nationalCodeInput
        />
      </div>
      <div class="flex flex-col gap-2">
        <div class="flex items-center justify-between">
          <label hlmLabel for="password">رمز عبور</label>
          <a class="text-primary text-xs hover:underline" href="#login"
            >فراموشی رمز عبور</a
          >
        </div>
        <input
          hlmInput
          id="password"
          type="password"
          placeholder="••••••••"
          #passwordInput
          (keyup.enter)="onSubmit(nationalCodeInput, passwordInput)"
        />
      </div>
      @if (error(); as message) {
        <p class="text-destructive text-sm" role="alert">{{ message }}</p>
      }
      <button
        hlmBtn
        class="w-full"
        [disabled]="loading()"
        (click)="onSubmit(nationalCodeInput, passwordInput)"
      >
        {{ loading() ? 'در حال ورود…' : 'ورود به سامانه' }}
      </button>
      <hlm-separator />
      <p class="text-muted-foreground text-center text-sm">
        فروشگاه طرف قرارداد هستید؟
        <a class="text-primary font-medium hover:underline" href="#login"
          >ورود به پنل فروشگاه</a
        >
      </p>
    </div>
  </section>

  <p class="text-muted-foreground text-center text-xs">
    © ۱۴۰۴ شرکت جهان‌فولاد سیرجان — طراحی و توسعه: شرکت طرح و توسعه دیار مانا
  </p>

</main>

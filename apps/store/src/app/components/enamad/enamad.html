@if (seal; as seal) {
<div class="flex justify-center">
  <a
    referrerpolicy="origin"
    target="_blank"
    [href]="'https://trustseal.enamad.ir/?id=' + seal.id + '&Code=' + seal.code"
  >
    @if (imageFailed()) {
    <span class="relative block h-[141px] w-[130px] overflow-hidden">
      <img
        src="/enamad-fallback-source.png"
        alt="استعلام اینماد"
        width="430"
        height="470"
        class="absolute -left-[42.5px] -top-[49px] h-[235px] w-[215px] max-w-none"
      >
    </span>
    } @else {
    <img
      referrerpolicy="origin"
      [src]="'https://trustseal.enamad.ir/logo.aspx?id=' + seal.id + '&Code=' + seal.code"
      [attr.code]="seal.code"
      alt="استعلام اینماد"
      (error)="imageFailed.set(true)"
    >
    }
  </a>
</div>
}

<div class="flex min-h-dvh w-full">
  <aside
    class="bg-sidebar/80 sticky top-0 hidden h-dvh w-64 shrink-0 flex-col border-e p-4 backdrop-blur-xl lg:flex print:hidden"
  >
    <div class="flex items-center gap-3 px-2 py-3">
      <div
        class="bg-primary text-primary-foreground flex size-10 shrink-0 items-center justify-center rounded-xl"
        aria-hidden="true"
      >
        <svg
          class="size-5"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z" />
          <path d="M3 6h18" />
          <path d="M16 10a4 4 0 0 1-8 0" />
        </svg>
      </div>
      <div class="min-w-0 leading-tight">
        <p class="truncate text-sm font-bold">{{ store()?.name }}</p>
        <p class="text-muted-foreground truncate text-xs">
          کد فروشگاه: <span dir="ltr">{{ store()?.code }}</span>
        </p>
      </div>
    </div>

    <div class="my-4 border-t"></div>
    <nav
      aria-label="ناوبری پنل فروشگاه"
      class="flex flex-1 flex-col gap-1 overflow-y-auto"
    >
      <a
        routerLink="/payments"
        routerLinkActive="bg-primary/10 text-primary font-semibold"
        #salesSide="routerLinkActive"
        [attr.aria-current]="salesSide.isActive ? 'page' : null"
        class="hover:bg-muted flex min-h-11 items-center gap-3 rounded-xl px-3 text-sm transition-colors"
      >
        <svg
          class="size-5 shrink-0"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path
            d="M3 10h18M6 6h12a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V9a3 3 0 0 1 3-3Zm10 8h2"
          />
        </svg>
        فروش‌ها
      </a>
      <a
        routerLink="/qr"
        routerLinkActive="bg-primary/10 text-primary font-semibold"
        #qrSide="routerLinkActive"
        [attr.aria-current]="qrSide.isActive ? 'page' : null"
        class="hover:bg-muted flex min-h-11 items-center gap-3 rounded-xl px-3 text-sm transition-colors"
      >
        <svg
          class="size-5 shrink-0"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path
            d="M3 9V3h6M15 3h6v6M3 15v6h6M21 15v6h-6M9 9h2v2H9zM15 9h2v2h-2zM9 15h2v2H9zM15 15h2v2h-2z"
          />
        </svg>
        کد QR
      </a>
      <a
        routerLink="/merchant-payment"
        routerLinkActive="bg-primary/10 text-primary font-semibold"
        #merchantSide="routerLinkActive"
        [attr.aria-current]="merchantSide.isActive ? 'page' : null"
        class="hover:bg-muted flex min-h-11 items-center gap-3 rounded-xl px-3 text-sm transition-colors"
      >
        <svg
          class="size-5 shrink-0"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path
            d="M7 3h10a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2ZM9 7h6M9 12h6M12 17h.01"
          />
        </svg>
        پرداخت پیامکی
      </a>
      <a
        routerLink="/reports"
        routerLinkActive="bg-primary/10 text-primary font-semibold"
        #reportsSide="routerLinkActive"
        [attr.aria-current]="reportsSide.isActive ? 'page' : null"
        class="hover:bg-muted flex min-h-11 items-center gap-3 rounded-xl px-3 text-sm transition-colors"
      >
        <svg
          class="size-5 shrink-0"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M4 20V4h16v16H4ZM8 16v-4m4 4V8m4 8v-6" />
        </svg>
        گزارش‌ها
      </a>
    </nav>

    <div class="border-t pt-4">
      <button
        hlmBtn
        variant="ghost"
        class="w-full justify-start gap-3"
        (click)="logout()"
      >
        <svg
          class="size-5"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path
            d="M15 17l5-5-5-5M20 12H9M12 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h6"
          />
        </svg>
        خروج از پنل
      </button>
    </div>
  </aside>

  <div class="flex min-w-0 flex-1 flex-col">
    <header
      class="sticky top-0 z-20 border-b backdrop-blur-xl lg:hidden print:hidden"
      style="
        background-color: color-mix(
          in oklab,
          var(--background) 88%,
          transparent
        );
      "
    >
      <div class="flex w-full items-center justify-between gap-3 px-4 py-3">
        <div class="flex min-w-0 items-center gap-2.5">
          <div
            class="bg-primary text-primary-foreground flex size-9 shrink-0 items-center justify-center rounded-[0.625rem]"
            aria-hidden="true"
          >
            <svg
              class="size-4.5"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z" />
              <path d="M3 6h18" />
              <path d="M16 10a4 4 0 0 1-8 0" />
            </svg>
          </div>
          <div class="min-w-0 leading-tight">
            <p class="truncate text-sm font-bold">{{ store()?.name }}</p>
            <p class="text-muted-foreground truncate text-[11px]">
              کد فروشگاه: <span dir="ltr">{{ store()?.code }}</span>
            </p>
          </div>
        </div>
        <button
          hlmBtn
          variant="ghost"
          size="sm"
          class="shrink-0"
          (click)="logout()"
        >
          خروج
        </button>
      </div>

      <nav aria-label="ناوبری پنل فروشگاه" class="w-full overflow-x-auto px-4">
        <ul class="flex min-w-max gap-1">
          <li>
            <a
              routerLink="/payments"
              routerLinkActive="border-current font-bold"
              #salesLink="routerLinkActive"
              [attr.aria-current]="salesLink.isActive ? 'page' : null"
              class="text-muted-foreground [&.border-current]:text-foreground inline-flex min-h-11 items-center border-b-2 border-transparent px-3 text-sm transition-colors"
              >فروش‌ها</a
            >
          </li>
          <li>
            <a
              routerLink="/qr"
              routerLinkActive="border-current font-bold"
              #qrLink="routerLinkActive"
              [attr.aria-current]="qrLink.isActive ? 'page' : null"
              class="text-muted-foreground [&.border-current]:text-foreground inline-flex min-h-11 items-center border-b-2 border-transparent px-3 text-sm transition-colors"
              >کد QR</a
            >
          </li>
          <li>
            <a
              routerLink="/merchant-payment"
              routerLinkActive="border-current font-bold"
              #merchantLink="routerLinkActive"
              [attr.aria-current]="merchantLink.isActive ? 'page' : null"
              class="text-muted-foreground [&.border-current]:text-foreground inline-flex min-h-11 items-center border-b-2 border-transparent px-3 text-sm transition-colors"
              >پرداخت پیامکی</a
            >
          </li>
          <li>
            <a
              routerLink="/reports"
              routerLinkActive="border-current font-bold"
              #reportsLink="routerLinkActive"
              [attr.aria-current]="reportsLink.isActive ? 'page' : null"
              class="text-muted-foreground [&.border-current]:text-foreground inline-flex min-h-11 items-center border-b-2 border-transparent px-3 text-sm transition-colors"
              >گزارش‌ها</a
            >
          </li>
        </ul>
      </nav>
    </header>

    <main class="w-full min-w-0 flex-1 lg:px-8 lg:py-4 print:p-0">
      <router-outlet />
    </main>
  </div>
</div>

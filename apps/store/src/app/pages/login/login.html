<div class="mx-auto flex min-h-dvh w-full max-w-md flex-col justify-center px-4 py-10">

  <div class="mb-8 flex flex-col items-center gap-3 text-center">
    <div
      class="bg-primary text-primary-foreground flex size-14 items-center justify-center rounded-2xl text-lg font-bold"
    >
      ج‌ف
    </div>
    <div>
      <h1 class="text-lg font-bold">پنل فروشگاه</h1>
      <p class="text-muted-foreground text-xs">سامانه رفاهی جهان‌فولاد سیرجان</p>
    </div>
  </div>

  <section hlmCard>
    <div hlmCardContent class="flex flex-col gap-4 pt-6">
      <div class="flex flex-col gap-2">
        <label hlmLabel for="username">نام کاربری فروشگاه</label>
        <input
          hlmInput
          id="username"
          #username
          dir="ltr"
          autocomplete="username"
          autocapitalize="off"
          spellcheck="false"
          class="w-full"
          placeholder="olympic"
          (keyup.enter)="password.focus()"
        />
      </div>

      <div class="flex flex-col gap-2">
        <label hlmLabel for="password">رمز عبور</label>
        <input
          hlmInput
          id="password"
          #password
          type="password"
          autocomplete="current-password"
          class="w-full"
          placeholder="••••••••"
          (keyup.enter)="submit(username, password)"
        />
      </div>

      @if (error()) {
        <p class="text-destructive text-xs">{{ error() }}</p>
      }

      <button
        hlmBtn
        class="w-full"
        [disabled]="loading()"
        (click)="submit(username, password)"
      >
        {{ loading() ? 'در حال ورود…' : 'ورود به پنل' }}
      </button>
    </div>
  </section>

  <p class="text-muted-foreground mt-8 text-center text-[0.65rem]">
    © ۱۴۰۴ شرکت جهان‌فولاد سیرجان — طراحی و توسعه: شرکت طرح و توسعه دیار مانا
  </p>
</div>

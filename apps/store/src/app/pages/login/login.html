<div
  class="mx-auto flex min-h-dvh w-full max-w-md flex-col justify-center px-4 py-10"
>
  <div class="mb-8 flex flex-col items-center gap-3 text-center">
    <img
      src="/favicon.svg"
      alt="صنعت‌پی"
      width="1030"
      height="1030"
      class="size-14 shrink-0 object-contain"
    />
    <div>
      <h1 class="text-lg font-bold">پنل فروشگاه</h1>
      <p class="text-muted-foreground text-xs">سامانه رفاهی صنعت پی</p>
    </div>
  </div>

  <section hlmCard>
    <div hlmCardContent class="flex flex-col gap-4 pt-6">
      <div class="flex flex-col gap-2">
        <label hlmLabel for="username">نام کاربری فروشگاه</label>
        <input
          hlmInput
          id="username"
          #username
          dir="ltr"
          autocomplete="username"
          autocapitalize="off"
          spellcheck="false"
          class="w-full"
          (keyup.enter)="password.focus()"
        />
      </div>

      <div class="flex flex-col gap-2">
        <label hlmLabel for="password">رمز عبور</label>
        <input
          hlmInput
          id="password"
          #password
          type="password"
          autocomplete="current-password"
          class="w-full"
          placeholder="••••••••"
          (keyup.enter)="submit(username, password)"
        />
      </div>

      @if (error()) {
      <p class="text-destructive text-xs">{{ error() }}</p>
      }

      <button
        hlmBtn
        class="w-full"
        [disabled]="loading()"
        (click)="submit(username, password)"
      >
        {{ loading() ? 'در حال ورود…' : 'ورود به پنل' }}
      </button>
      <a
        hlmBtn
        variant="outline"
        class="w-full"
        href="https://sanpayco.com/login"
      >
        <svg
          class="size-4"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="m12 19 7-7-7-7M5 12h14" />
        </svg>
        بازگشت به ورود کارکنان
      </a>
    </div>
  </section>

  <p class="text-muted-foreground mt-8 text-center text-[0.65rem]">
    © ۱۴۰۵ شرکت جهان‌فولاد سیرجان — طراحی و توسعه: شرکت جهان صنعت پویا نگین مشیز
  </p>
</div>

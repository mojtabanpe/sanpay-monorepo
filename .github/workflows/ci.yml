name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  actions: read
  contents: read

env:
  # The workspace is not connected to Nx Cloud; without this, nx tries it and fails.
  NX_NO_CLOUD: true

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      # pnpm must be on PATH before setup-node so `cache: 'pnpm'` can find its store.
      # The version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v4

      # Cache the pnpm store
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run api:test-deploy
      - run: pnpm exec playwright install --with-deps

      - run: pnpm nx format:check --base="remotes/origin/master"
      - run: pnpm nx run-many -t lint test build typecheck e2e
